<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bodycam Tactical Shooter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            position: fixed;
            top: 0;
            left: 0;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 18+ Yaş Uyarısı */
        #age-gate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #fff;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 99999; text-align: center; padding: 20px;
        }
        #age-gate h1 { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
        #age-gate p { font-size: 14px; color: #aaa; margin-bottom: 20px; }
        #age-gate button {
            background: #fff; color: #000; border: none; padding: 14px 36px;
            font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
        }

        /* Bodycam Vinyet / Scanline */
        #bodycam-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 2;
            box-shadow: inset 0 0 140px rgba(0,0,0,0.9);
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%);
            background-size: 100% 4px;
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 5px; height: 5px;
            background-color: #8b0000;
            border: 1px solid #000;
            border-radius: 50%;
            pointer-events: none; z-index: 3;
            transition: opacity 0.2s;
        }

        /* Sol Üst - E Menü Butonu */
        #menu-btn {
            position: absolute; top: 15px; left: 15px;
            width: 48px; height: 48px;
            background: rgba(0, 0, 0, 0.6);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px; color: #fff;
            font-size: 20px; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
            z-index: 10; cursor: pointer; backdrop-filter: blur(4px);
        }

        /* Sağ Üst - Kırmızı -X Skor */
        #kill-counter {
            position: absolute; top: 15px; right: 25px; z-index: 10;
            color: #cc0000; font-size: 38px; font-weight: 900;
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
            pointer-events: none;
        }

        /* Joystick & Butonlar */
        #joystick-zone {
            position: absolute; bottom: 25px; left: 25px;
            width: 140px; height: 140px; z-index: 10;
        }
        #joystick-base {
            width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; position: relative;
        }
        #joystick-stick {
            width: 55px; height: 55px;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid #fff; border-radius: 50%;
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        .action-btns {
            position: absolute; bottom: 20px; right: 20px; z-index: 10;
            display: grid; grid-template-columns: repeat(3, 62px); grid-gap: 12px;
        }
        .btn {
            width: 62px; height: 62px;
            background: rgba(0, 0, 0, 0.65);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; color: #fff;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 11px; font-weight: bold; backdrop-filter: blur(4px);
            touch-action: manipulation;
        }
        .btn:active, .btn.active-mode { background: rgba(255, 255, 255, 0.4); border-color: #fff; }
        #btn-fire {
            grid-column: 3; grid-row: 2;
            width: 72px; height: 72px;
            background: rgba(180, 0, 0, 0.65); border-color: #ff3333;
        }

        /* Menü */
        #settings-menu {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; max-width: 380px; max-height: 85vh;
            background: rgba(15, 15, 15, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px; z-index: 100;
            display: none; flex-direction: column; color: #fff; padding: 18px;
            overflow-y: auto;
        }
        #settings-menu h2 { font-size: 18px; margin-bottom: 12px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .menu-btn-item {
            width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444;
            color: #fff; border-radius: 8px; font-weight: bold; font-size: 13px; margin-top: 6px;
        }
        .music-player { background: rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 10px; margin-top: 10px; text-align: center; }
        .track-info { font-size: 12px; color: #4da6ff; margin-bottom: 8px; font-weight: bold; }
        .player-controls { display: flex; justify-content: center; gap: 8px; }
        .player-btn { background: #333; border: 1px solid #555; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="age-gate">
        <h1>SADECE 18 YAŞINDAYSAN GİR</h1>
        <p>Bu oyun şiddet ve silah içerikleri barındırmaktadır.</p>
        <button id="age-btn">GİRİŞ YAP</button>
    </div>

    <div id="canvas-container"></div>
    <div id="bodycam-overlay"></div>
    <div id="crosshair"></div>

    <div id="menu-btn">E</div>
    <div id="kill-counter">-0</div>

    <div id="joystick-zone">
        <div id="joystick-base"><div id="joystick-stick"></div></div>
    </div>

    <div class="action-btns">
        <button class="btn" id="btn-crouch">EĞİL</button>
        <button class="btn" id="btn-sprint">KOŞ</button>
        <button class="btn" id="btn-switch">SİLAH</button>
        <button class="btn" id="btn-reload">DOLDUR</button>
        <button class="btn" id="btn-aim">NİŞAN</button>
        <button class="btn" id="btn-fire">ATEŞ</button>
    </div>

    <div id="settings-menu">
        <h2>AYARLAR & SANDBOX</h2>
        <button class="menu-btn-item" id="spawn-npc-btn">NPC Spawn Et (+1)</button>
        <button class="menu-btn-item" id="clear-npcs-btn" style="background:#552222;">Tüm NPC'leri Temizle</button>
        
        <div class="music-player">
            <div class="track-info" id="track-name">Parça: songs/1.mp4</div>
            <div class="player-controls">
                <button class="player-btn" id="music-prev">◄◄</button>
                <button class="player-btn" id="music-play">Oynat</button>
                <button class="player-btn" id="music-next">►►</button>
            </div>
        </div>

        <button class="menu-btn-item" id="close-menu" style="background:#aa0000; margin-top:12px;">Kapat</button>
    </div>

    <video id="audio-element" loop style="display:none;"></video>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        document.getElementById('age-btn').addEventListener('click', () => {
            document.getElementById('age-gate').style.display = 'none';
            if (!window.audioCtx) window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            resizeCanvas();
        });

        // --- Müzik Çalar ---
        let currentTrack = 1, isPlaying = false;
        const audioEl = document.getElementById('audio-element');
        const trackNameEl = document.getElementById('track-name');

        function loadTrack(idx) {
            currentTrack = idx;
            audioEl.src = `songs/${currentTrack}.mp4`;
            trackNameEl.innerText = `Parça: songs/${currentTrack}.mp4`;
            if (isPlaying) audioEl.play().catch(e => console.log("Video/Ses bulunamadı."));
        }

        document.getElementById('music-play').addEventListener('click', () => {
            if (!audioEl.src) loadTrack(1);
            if (isPlaying) { audioEl.pause(); isPlaying = false; document.getElementById('music-play').innerText = "Oynat"; }
            else { audioEl.play().then(() => { isPlaying = true; document.getElementById('music-play').innerText = "Duraklat"; }).catch(() => alert("songs/" + currentTrack + ".mp4 bulunamadı.")); }
        });
        document.getElementById('music-next').addEventListener('click', () => loadTrack(currentTrack + 1));
        document.getElementById('music-prev').addEventListener('click', () => { if (currentTrack > 1) loadTrack(currentTrack - 1); });

        // --- Three.js Kurulumu ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.05, 1000);
        camera.rotation.order = 'YXZ';

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        function resizeCanvas() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
        resizeCanvas();

        // Işıklandırma
        scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.9));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // Baseplate Zemin
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x6b7c62, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // --- Oyuncu ---
        const player = { pos: new THREE.Vector3(0, 1.65, 0), yaw: 0, pitch: 0, isCrouch: false, isSprint: false, isAim: false, kills: 0 };
        camera.position.copy(player.pos);
        scene.add(camera);

        const weaponGroup = new THREE.Group();
        camera.add(weaponGroup);

        // --- Silah Sistemi & Güvenli Fallback ---
        let currentWeaponIndex = 0;
        let weapons = [];
        let weaponMixers = [];

        // Garanti Görünür Detaylı FPS Silah Taslağı (GLTF yüklenene kadar veya hata durumunda ekranda kalır)
        function createFPSGunMesh(isM4) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: isM4 ? 0x2b2b2b : 0x1a1a1a, roughness: 0.4 });
            const metalMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8 });

            const body = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, isM4 ? 0.6 : 0.35), mat);
            body.position.set(0, 0, isM4 ? -0.1 : 0);
            
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, isM4 ? 0.4 : 0.2), metalMat);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0, 0.02, isM4 ? -0.35 : -0.2);

            const mag = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.2, 0.08), metalMat);
            mag.position.set(0, -0.12, isM4 ? 0.05 : 0);
            mag.rotation.x = isM4 ? 0.2 : 0.1;

            group.add(body, barrel, mag);
            group.position.set(0.2, -0.22, -0.38);
            return group;
        }

        const m4Mesh = createFPSGunMesh(true);
        const glockMesh = createFPSGunMesh(false);
        glockMesh.visible = false;
        weaponGroup.add(m4Mesh);
        weaponGroup.add(glockMesh);
        weapons = [m4Mesh, glockMesh];

        // Harici GLTF Yükleme (Eğer yüklenirse fallback yerine geçer)
        const gltfLoader = new THREE.GLTFLoader();

        gltfLoader.load('guns/m4a1/scene.gltf', (gltf) => {
            const model = gltf.scene;
            model.scale.set(5.0, 5.0, 5.0);
            model.position.set(0.18, -0.25, -0.4);
            model.rotation.set(0, Math.PI, 0);

            if (gltf.animations.length > 0) {
                const mixer = new THREE.AnimationMixer(model);
                const action = mixer.clipAction(gltf.animations[0]);
                action.play();
                action.paused = true;
                weaponMixers[0] = { mixer, action };
            }

            weaponGroup.remove(m4Mesh);
            weaponGroup.add(model);
            weapons[0] = model;
        }, undefined, (err) => console.log("M4A1 gltf yüklenemedi, varsayılan model aktif."));

        gltfLoader.load('guns/glock/scene.gltf', (gltf) => {
            const model = gltf.scene;
            model.scale.set(4.0, 4.0, 4.0);
            model.position.set(0.15, -0.2, -0.35);
            model.rotation.set(0, Math.PI, 0);
            model.visible = false;

            if (gltf.animations.length > 0) {
                const mixer = new THREE.AnimationMixer(model);
                const action = mixer.clipAction(gltf.animations[0]);
                action.play();
                action.paused = true;
                weaponMixers[1] = { mixer, action };
            }

            weaponGroup.remove(glockMesh);
            weaponGroup.add(model);
            weapons[1] = model;
        }, undefined, (err) => console.log("Glock gltf yüklenemedi, varsayılan model aktif."));

        // --- Organik NPC Yapısı ---
        const npcs = [];
        function spawnNPC(x, z) {
            const group = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xd2a282, roughness: 0.6 });
            const clothesMat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), skinMat);
            head.position.y = 1.55;
            head.userData = { isHead: true };

            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.13, 0.55, 16), clothesMat);
            torso.position.y = 1.15;

            const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.6, 12), clothesMat);
            legL.position.set(-0.08, 0.6, 0);
            const legR = legL.clone(); legR.position.x = 0.08;

            const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.04, 0.5, 12), skinMat);
            armL.position.set(-0.2, 1.2, 0);
            const armR = armL.clone(); armR.position.x = 0.2;

            group.add(head, torso, legL, legR, armL, armR);
            group.position.set(x, 0, z);
            scene.add(group);

            npcs.push({ group, head, legL, legR, armL, armR, health: 100, isDead: false, fleeing: false, targetAngle: 0, animTime: 0 });
        }

        for (let i = 0; i < 5; i++) spawnNPC((Math.random() - 0.5) * 16, -6 - Math.random() * 10);

        // --- Ateş Etme & Hasar ---
        function fire() {
            weaponGroup.position.z += 0.05;
            weaponGroup.rotation.x += 0.08;
            if (navigator.vibrate) navigator.vibrate(35);

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const hitObjects = [];
            npcs.forEach(n => { if (!n.isDead) n.group.traverse(c => { if (c.isMesh) hitObjects.push(c); }); });

            const hits = raycaster.intersectObjects(hitObjects);
            if (hits.length > 0) {
                const hitMesh = hits[0].object;
                const npc = npcs.find(n => n.group.getObjectById(hitMesh.id) !== undefined);
                if (npc && !npc.isDead) {
                    const isHead = (hitMesh === npc.head || hitMesh.userData.isHead);
                    npc.health -= isHead ? 100 : 35;
                    npc.fleeing = true;
                    if (npc.health <= 0) {
                        npc.isDead = true;
                        npc.group.rotation.x = -Math.PI / 2;
                        npc.group.position.y = 0.15;
                        player.kills++;
                        document.getElementById('kill-counter').innerText = `-${player.kills}`;
                    }
                }
            }
        }

        // --- Kontroller & Lag ---
        let touchX = 0, touchY = 0, camId = null;
        let deltaYaw = 0, deltaPitch = 0;

        window.addEventListener('touchstart', (e) => {
            for (let t of e.changedTouches) {
                if (t.clientX > window.innerWidth / 2 && camId === null) {
                    camId = t.identifier; touchX = t.clientX; touchY = t.clientY;
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === camId) {
                    deltaYaw = -(t.clientX - touchX) * 0.005;
                    deltaPitch = -(t.clientY - touchY) * 0.005;

                    player.yaw += deltaYaw;
                    player.pitch += deltaPitch;
                    player.pitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, player.pitch));

                    touchX = t.clientX; touchY = t.clientY;
                }
            }
        });

        const resetCam = (e) => { for (let t of e.changedTouches) { if (t.identifier === camId) camId = null; } };
        window.addEventListener('touchend', resetCam);
        window.addEventListener('touchcancel', resetCam);

        // Joystick
        const joyBase = document.getElementById('joystick-base');
        const joyStick = document.getElementById('joystick-stick');
        let joyVec = { x: 0, y: 0 }, joyId = null;

        joyBase.addEventListener('touchstart', (e) => { joyId = e.changedTouches[0].identifier; updateJoy(e.changedTouches[0]); });
        window.addEventListener('touchmove', (e) => { for (let t of e.changedTouches) if (t.identifier === joyId) updateJoy(t); });
        const stopJoy = (e) => { for (let t of e.changedTouches) if (t.identifier === joyId) { joyId = null; joyVec = { x: 0, y: 0 }; joyStick.style.transform = 'translate(-50%, -50%)'; } };
        window.addEventListener('touchend', stopJoy); window.addEventListener('touchcancel', stopJoy);

        function updateJoy(t) {
            const rect = joyBase.getBoundingClientRect();
            let dx = t.clientX - (rect.left + rect.width / 2);
            let dy = t.clientY - (rect.top + rect.height / 2);
            const dist = Math.min(Math.hypot(dx, dy), 50);
            const angle = Math.atan2(dy, dx);
            dx = Math.cos(angle) * dist; dy = Math.sin(angle) * dist;
            joyStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joyVec = { x: dx / 50, y: dy / 50 };
        }

        // Butonlar
        document.getElementById('btn-fire').addEventListener('touchstart', (e) => { e.preventDefault(); fire(); });
        document.getElementById('btn-reload').addEventListener('click', () => {
            const m = weaponMixers[currentWeaponIndex];
            if (m) { m.action.reset(); m.action.paused = false; m.action.play(); }
        });
        document.getElementById('btn-switch').addEventListener('click', () => {
            weapons[currentWeaponIndex].visible = false;
            currentWeaponIndex = (currentWeaponIndex + 1) % weapons.length;
            weapons[currentWeaponIndex].visible = true;
        });

        const aimBtn = document.getElementById('btn-aim');
        aimBtn.addEventListener('click', () => {
            player.isAim = !player.isAim;
            aimBtn.classList.toggle('active-mode', player.isAim);
            document.getElementById('crosshair').style.opacity = player.isAim ? '0.2' : '1';
        });

        document.getElementById('btn-sprint').addEventListener('click', () => {
            player.isSprint = !player.isSprint;
            document.getElementById('btn-sprint').classList.toggle('active-mode', player.isSprint);
        });

        document.getElementById('btn-crouch').addEventListener('click', () => {
            player.isCrouch = !player.isCrouch;
            document.getElementById('btn-crouch').classList.toggle('active-mode', player.isCrouch);
        });

        document.getElementById('menu-btn').addEventListener('click', () => {
            const m = document.getElementById('settings-menu');
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        });
        document.getElementById('close-menu').addEventListener('click', () => document.getElementById('settings-menu').style.display = 'none');
        document.getElementById('spawn-npc-btn').addEventListener('click', () => spawnNPC((Math.random() - 0.5) * 12, camera.position.z - 8));
        document.getElementById('clear-npcs-btn').addEventListener('click', () => { npcs.forEach(n => scene.remove(n.group)); npcs.length = 0; });

        // --- Döngü ---
        const clock = new THREE.Clock();
        let weaponLagRotationX = 0, weaponLagRotationY = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            weaponMixers.forEach(m => { if (m) m.mixer.update(delta); });

            camera.rotation.x = player.pitch;
            camera.rotation.y = player.yaw;
            camera.rotation.z = 0;

            const speed = player.isSprint ? 0.12 : (player.isCrouch ? 0.04 : 0.07);
            const moveZ = joyVec.y * speed, moveX = joyVec.x * speed;
            player.pos.x += moveX * Math.cos(player.yaw) + moveZ * Math.sin(player.yaw);
            player.pos.z += -moveX * Math.sin(player.yaw) + moveZ * Math.cos(player.yaw);

            player.pos.y += ((player.isCrouch ? 1.0 : 1.65) - player.pos.y) * 0.1;
            camera.position.copy(player.pos);

            // Eylemsizlik / Lag
            weaponLagRotationY += (deltaYaw * 1.5 - weaponLagRotationY) * 0.1;
            weaponLagRotationX += (deltaPitch * 1.5 - weaponLagRotationX) * 0.1;
            deltaYaw = 0; deltaPitch = 0;

            const isMoving = Math.abs(joyVec.x) > 0.1 || Math.abs(joyVec.y) > 0.1;
            const bobSpeed = isMoving ? (player.isSprint ? 14 : 9) : 2.5;
            const bobAmt = isMoving ? (player.isSprint ? 0.045 : 0.025) : 0.006;
            const bobX = Math.cos(time * bobSpeed) * bobAmt;
            const bobY = Math.sin(time * bobSpeed * 2) * bobAmt;

            // Nişan alma yumuşatması
            const targetPos = player.isAim ? new THREE.Vector3(0, -0.12, -0.25) : new THREE.Vector3(0.2, -0.22, -0.38);
            const targetRotY = player.isAim ? 0 : weaponLagRotationY;
            const targetRotX = player.isAim ? 0 : weaponLagRotationX;

            weaponGroup.position.x += (targetPos.x + bobX - weaponGroup.position.x) * 0.12;
            weaponGroup.position.y += (targetPos.y + bobY - weaponGroup.position.y) * 0.12;
            weaponGroup.position.z += (targetPos.z - weaponGroup.position.z) * 0.12;

            weaponGroup.rotation.y += (targetRotY - weaponGroup.rotation.y) * 0.1;
            weaponGroup.rotation.x += (targetRotX - weaponGroup.rotation.x) * 0.1;
            weaponGroup.rotation.x *= 0.85;

            npcs.forEach(n => {
                if (n.isDead) return;
                if (n.fleeing) {
                    n.group.translateZ(0.04);
                    n.animTime += delta * 8;
                    n.legL.rotation.x = Math.sin(n.animTime) * 0.6;
                    n.legR.rotation.x = -Math.sin(n.animTime) * 0.6;
                }
            });

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
