<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kira's Sh00ting</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 18+ Yaş Doğrulama */
        #age-gate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            text-align: center;
            padding: 20px;
        }
        #age-gate h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        #age-gate p {
            font-size: 15px;
            color: #aaa;
            margin-bottom: 25px;
        }
        #age-gate button {
            background: #fff;
            color: #000;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Bodycam CRT / Vignette Effect */
        #bodycam-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.85);
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            display: block;
        }

        /* Crosshair Noktası */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 7px;
            height: 7px;
            background-color: #8b0000;
            border: 1px solid #000;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
        }

        /* Sol Üst - E Butonu */
        #menu-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 48px;
            height: 48px;
            background: rgba(0, 0, 0, 0.6);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        /* Sağ Üst - Kırmızı -X Skor */
        #kill-counter {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 10;
            color: #cc0000;
            font-size: 38px;
            font-weight: 900;
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-shadow: 
                -2px -2px 0 #000,  
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0 0 10px rgba(0, 0, 0, 0.9);
            pointer-events: none;
        }

        /* Mobil Kontroller */
        #joystick-zone {
            position: absolute;
            bottom: 25px;
            left: 25px;
            width: 140px;
            height: 140px;
            z-index: 10;
        }
        #joystick-base {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            position: relative;
        }
        #joystick-stick {
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Aksiyon Butonları */
        .action-btns {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            display: grid;
            grid-template-columns: repeat(3, 62px);
            grid-gap: 12px;
        }
        .btn {
            width: 62px;
            height: 62px;
            background: rgba(0, 0, 0, 0.65);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            backdrop-filter: blur(4px);
            touch-action: manipulation;
        }
        .btn:active, .btn.active {
            background: rgba(255, 255, 255, 0.4);
            border-color: #fff;
        }
        #btn-fire {
            grid-column: 3;
            grid-row: 2;
            width: 72px;
            height: 72px;
            background: rgba(180, 0, 0, 0.65);
            border-color: #ff3333;
        }

        /* Ayarlar & Sandbox Menüsü (E Tusu) */
        #settings-menu {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 380px;
            max-height: 85vh;
            background: rgba(15, 15, 15, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            z-index: 100;
            display: none;
            flex-direction: column;
            color: #fff;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow-y: auto;
        }
        #settings-menu h2 {
            font-size: 18px;
            margin-bottom: 12px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 8px;
        }
        .menu-group {
            margin-bottom: 14px;
        }
        .menu-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #ccc;
        }
        .menu-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }
        .menu-btn-item {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            margin-top: 4px;
        }
        .menu-btn-item:active {
            background: #444;
        }
        #close-menu {
            background: #aa0000;
            border: none;
            margin-top: 10px;
        }

        /* Müzik Çalar Alanı */
        .music-player {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px;
            margin-top: 8px;
            text-align: center;
        }
        .track-info {
            font-size: 12px;
            color: #4da6ff;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .player-controls {
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .player-btn {
            background: #333;
            border: 1px solid #555;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Gizli Video Oynatıcı */
        #audio-element {
            display: none;
        }
    </style>
</head>
<body>

    <!-- 18+ Yas Uyarisi -->
    <div id="age-gate">
        <h1>SADECE 18 YASINDAIYSAN GIR</h1>
        <p>Bu oyun şiddet ve silah içerikleri barındırmaktadır.</p>
        <button id="age-btn">GİRİŞ YAP</button>
    </div>

    <!-- Canvas & Overlay -->
    <div id="canvas-container"></div>
    <div id="bodycam-overlay"></div>
    <div id="crosshair"></div>

    <!-- HUD Elements -->
    <div id="menu-btn">E</div>
    <div id="kill-counter">-0</div>

    <!-- Mobil Kontroller -->
    <div id="joystick-zone">
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>
    </div>

    <div class="action-btns">
        <button class="btn" id="btn-crouch">EĞİL</button>
        <button class="btn" id="btn-sprint">KOŞ</button>
        <button class="btn" id="btn-switch">SİLAH</button>
        <button class="btn" id="btn-reload">DOLDUR</button>
        <button class="btn" id="btn-aim">NİŞAN</button>
        <button class="btn" id="btn-fire">ATEŞ</button>
    </div>

    <!-- E Menusu / Sandbox Ayarlari -->
    <div id="settings-menu">
        <h2>AYARLAR & SANDBOX</h2>
        
        <div class="menu-group">
            <button class="menu-btn-item" id="spawn-npc-btn">NPC Spawn Et (+1)</button>
            <button class="menu-btn-item" id="clear-npcs-btn" style="background:#552222;">Tüm NPC'leri Temizle</button>
        </div>

        <div class="menu-group">
            <div class="menu-row">
                <span>Kan Efektleri</span>
                <input type="checkbox" id="blood-toggle" checked>
            </div>
            <div class="menu-row">
                <span>Bodycam Vinyet & Çizgiler</span>
                <input type="checkbox" id="bodycam-fx-toggle" checked>
            </div>
        </div>

        <div class="menu-group">
            <label for="fov-slider">FOV (Kamera Açısı)</label>
            <input type="range" id="fov-slider" min="60" max="110" value="85" style="width:100%;">
        </div>

        <!-- Müzik Oynatıcı -->
        <div class="menu-group">
            <label>MÜZİK ÇALAR (songs/1.mp4 ...)</label>
            <div class="music-player">
                <div class="track-info" id="track-name">Parça: songs/1.mp4</div>
                <div class="player-controls">
                    <button class="player-btn" id="music-prev">◄◄</button>
                    <button class="player-btn" id="music-play">Oynat</button>
                    <button class="player-btn" id="music-next">►►</button>
                </div>
            </div>
        </div>

        <button class="menu-btn-item" id="close-menu">Kapat</button>
    </div>

    <video id="audio-element" loop></video>

    <!-- Three.js ve GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // --- 18+ Yas Gate ---
        document.getElementById('age-btn').addEventListener('click', () => {
            document.getElementById('age-gate').style.display = 'none';
            initAudio();
        });

        // --- Müzik Çalar Mantığı ---
        let currentTrackIndex = 1;
        let isPlaying = false;
        const audioEl = document.getElementById('audio-element');
        const trackNameEl = document.getElementById('track-name');
        const playBtn = document.getElementById('music-play');

        function loadTrack(index) {
            currentTrackIndex = index;
            const src = `songs/${currentTrackIndex}.mp4`;
            audioEl.src = src;
            trackNameEl.innerText = `Parça: ${src}`;
            if (isPlaying) {
                audioEl.play().catch(e => console.log("Müzik dosyası bulunamadı/oynatılamadı:", src));
            }
        }

        document.getElementById('music-play').addEventListener('click', () => {
            if (!audioEl.src) loadTrack(1);
            if (isPlaying) {
                audioEl.pause();
                isPlaying = false;
                playBtn.innerText = "Oynat";
            } else {
                audioEl.play().then(() => {
                    isPlaying = true;
                    playBtn.innerText = "Duraklat";
                }).catch(e => {
                    alert("songs/" + currentTrackIndex + ".mp4 dosyası bulunamadı.");
                });
            }
        });

        document.getElementById('music-next').addEventListener('click', () => {
            loadTrack(currentTrackIndex + 1);
        });

        document.getElementById('music-prev').addEventListener('click', () => {
            if (currentTrackIndex > 1) loadTrack(currentTrackIndex - 1);
        });

        audioEl.addEventListener('ended', () => {
            loadTrack(currentTrackIndex + 1);
        });

        function initAudio() {
            // Web Audio API Tıklama Sesleri
            window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playGunSound(isGlock) {
            if (!window.audioCtx) return;
            const osc = window.audioCtx.createOscillator();
            const gain = window.audioCtx.createGain();
            osc.type = isGlock ? 'square' : 'sawtooth';
            osc.frequency.setValueAtTime(isGlock ? 300 : 180, window.audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, window.audioCtx.currentTime + (isGlock ? 0.15 : 0.25));
            gain.gain.setValueAtTime(0.5, window.audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, window.audioCtx.currentTime + (isGlock ? 0.15 : 0.25));
            osc.connect(gain);
            gain.connect(window.audioCtx.destination);
            osc.start();
            osc.stop(window.audioCtx.currentTime + (isGlock ? 0.15 : 0.25));
        }

        // --- THREE.JS KURULUMU ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Mavi hava
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.05, 1000);
        camera.rotation.order = 'YXZ'; // Kamera yamulmasını önleyen kilit

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Işıklandırma
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.7);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // Baseplate (Zemin)
        const gridTexture = createGridTexture();
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshStandardMaterial({ map: gridTexture, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        function createGridTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#6b7c62'; ctx.fillRect(0,0,256,256);
            ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 4;
            ctx.strokeRect(0,0,256,256);
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(50, 50);
            return texture;
        }

        // --- Oyuncu Mantığı ---
        const player = {
            pos: new THREE.Vector3(0, 1.65, 0),
            yaw: 0,
            pitch: 0,
            isCrouching: false,
            isSprinting: false,
            isAiming: false,
            speed: 0.08,
            kills: 0
        };

        camera.position.copy(player.pos);

        // --- Silah ve GLTFLoader Entegrasyonu ---
        const weaponGroup = new THREE.Group();
        camera.add(weaponGroup);
        scene.add(camera);

        const gltfLoader = new THREE.GLTFLoader();
        let currentWeaponIndex = 0; // 0: M4A1, 1: Glock
        let weapons = [];
        let mixers = [];

        // M4A1 Prosedürel/Dahili Fallback Mesh
        const m4Group = createProceduralM4();
        weaponGroup.add(m4Group);

        // Glock Prosedürel/Dahili Fallback Mesh
        const glockGroup = createProceduralGlock();
        glockGroup.visible = false;
        weaponGroup.add(glockGroup);

        weapons = [m4Group, glockGroup];

        // Harici .gltf Modellerini Yükleme Mantığı (guns/m4a1/scene.gltf & guns/glock/scene.gltf)
        gltfLoader.load('guns/m4a1/scene.gltf', (gltf) => {
            const model = gltf.scene;
            model.scale.set(0.15, 0.15, 0.15);
            model.position.set(0.2, -0.3, -0.4);
            model.rotation.set(0, Math.PI, 0);
            
            if (gltf.animations.length > 0) {
                const mixer = new THREE.AnimationMixer(model);
                const action = mixer.clipAction(gltf.animations[0]);
                action.play();
                action.paused = true; // Dondurulmuş pozisyon
                mixers[0] = { mixer, action };
            }

            weaponGroup.remove(m4Group);
            weaponGroup.add(model);
            weapons[0] = model;
        }, undefined, (err) => console.log("Harici M4A1 modeli bulunamadı, prosedürel model aktif."));

        gltfLoader.load('guns/glock/scene.gltf', (gltf) => {
            const model = gltf.scene;
            model.scale.set(0.15, 0.15, 0.15);
            model.position.set(0.15, -0.25, -0.35);
            model.rotation.set(0, Math.PI, 0);
            model.visible = false;

            if (gltf.animations.length > 0) {
                const mixer = new THREE.AnimationMixer(model);
                const action = mixer.clipAction(gltf.animations[0]);
                action.play();
                action.paused = true;
                mixers[1] = { mixer, action };
            }

            weaponGroup.remove(glockGroup);
            weaponGroup.add(model);
            weapons[1] = model;
        }, undefined, (err) => console.log("Harici Glock modeli bulunamadı, prosedürel model aktif."));

        function createProceduralM4() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.1, 0.45), mat);
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.35), mat);
            barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.02, -0.35);
            const mag = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.18, 0.08), mat);
            mag.position.set(0, -0.1, -0.05); mag.rotation.x = 0.2;
            group.add(body, barrel, mag);
            group.position.set(0.2, -0.25, -0.45);
            return group;
        }

        function createProceduralGlock() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.4 });
            const slide = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.05, 0.22), mat);
            const handle = new THREE.Mesh(new THREE.BoxGeometry(0.038, 0.12, 0.06), mat);
            handle.position.set(0, -0.07, 0.04); handle.rotation.x = 0.25;
            group.add(slide, handle);
            group.position.set(0.15, -0.2, -0.35);
            return group;
        }

        // --- R15 Organik İnsan NPC Sistemi ---
        const npcs = [];
        let allowBlood = true;

        function spawnNPC(x, z) {
            const npcGroup = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xd2a282, roughness: 0.7 });
            const clothesMat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff, roughness: 0.8 });

            // Kafatası
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), skinMat);
            head.position.y = 1.55;
            head.castShadow = true;
            head.userData = { isHead: true };

            // Gövde
            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.14, 0.55, 12), clothesMat);
            torso.position.y = 1.15;
            torso.castShadow = true;

            // Bacaklar & Kollar (R15 Eklemli)
            const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.6), clothesMat);
            legL.position.set(-0.09, 0.6, 0);
            const legR = legL.clone();
            legR.position.x = 0.09;

            const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.04, 0.5), skinMat);
            armL.position.set(-0.21, 1.2, 0);
            const armR = armL.clone();
            armR.position.x = 0.21;

            npcGroup.add(head, torso, legL, legR, armL, armR);
            npcGroup.position.set(x, 0, z);

            scene.add(npcGroup);

            npcs.push({
                group: npcGroup,
                head: head,
                legL: legL, legR: legR,
                armL: armL, armR: armR,
                health: 100,
                isDead: false,
                fleeing: false,
                changeDirTimer: 0,
                targetAngle: Math.random() * Math.PI * 2,
                animTime: Math.random() * 10
            });
        }

        // İlk 5 NPC
        for(let i=0; i<5; i++) {
            spawnNPC((Math.random() - 0.5) * 20, -6 - Math.random() * 15);
        }

        // --- Ateş Etme & Hasar Sistemi ---
        function fireWeapon() {
            playGunSound(currentWeaponIndex === 1);

            // Silah Tepmesi (Recoil)
            weaponGroup.position.z += 0.05;
            weaponGroup.rotation.x += 0.08;

            // Titreşim
            if (navigator.vibrate) navigator.vibrate(40);

            // Raycaster (Ateş İzleme)
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);

            const hitObjects = [];
            npcs.forEach(n => {
                if(!n.isDead) n.group.traverse(child => { if(child.isMesh) hitObjects.push(child); });
            });

            const intersects = raycaster.intersectObjects(hitObjects);

            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                const point = intersects[0].point;

                // NPC Bulma
                const npc = npcs.find(n => n.group.getObjectById(hitMesh.id) !== undefined);

                if (npc && !npc.isDead) {
                    const isHeadshot = (hitMesh === npc.head || hitMesh.userData.isHead);
                    const damage = isHeadshot ? 100 : 35;
                    npc.health -= damage;

                    if (allowBlood) createBloodSplatter(point);

                    // Korkup Kaçma Tetikleyici
                    npc.fleeing = true;

                    if (npc.health <= 0) {
                        killNPC(npc);
                    }
                }
            }

            // Yakındaki tüm NPC'leri korkut
            npcs.forEach(n => {
                if(n.group.position.distanceTo(player.pos) < 15) n.fleeing = true;
            });
        }

        function createBloodSplatter(pos) {
            const bloodGeo = new THREE.SphereGeometry(0.08 + Math.random()*0.05, 8, 8);
            const bloodMat = new THREE.MeshBasicMaterial({ color: 0x880000 });
            const blood = new THREE.Mesh(bloodGeo, bloodMat);
            blood.position.copy(pos);
            scene.add(blood);
            setTimeout(() => scene.remove(blood), 4000);
        }

        function killNPC(npc) {
            npc.isDead = true;
            npc.group.rotation.x = -Math.PI / 2; // Yere düşme
            npc.group.position.y = 0.15;
            player.kills++;
            document.getElementById('kill-counter').innerText = `-${player.kills}`;
        }

        // --- Dokunmatik Kontroller & Kamera ---
        let touchStartX = 0, touchStartY = 0;
        let isDraggingCam = false;
        let camTouchId = null;

        window.addEventListener('touchstart', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.clientX > window.innerWidth / 2 && camTouchId === null) {
                    camTouchId = touch.identifier;
                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                    isDraggingCam = true;
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === camTouchId) {
                    const deltaX = touch.clientX - touchStartX;
                    const deltaY = touch.clientY - touchStartY;

                    player.yaw -= deltaX * 0.005;
                    player.pitch -= deltaY * 0.005;
                    player.pitch = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, player.pitch));

                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                }
            }
        });

        const resetCamTouch = (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === camTouchId) {
                    camTouchId = null;
                    isDraggingCam = false;
                }
            }
        };
        window.addEventListener('touchend', resetCamTouch);
        window.addEventListener('touchcancel', resetCamTouch);

        // Joystick Mantığı
        const joyBase = document.getElementById('joystick-base');
        const joyStick = document.getElementById('joystick-stick');
        let joyVector = { x: 0, y: 0 };
        let joyTouchId = null;

        joyBase.addEventListener('touchstart', (e) => {
            const touch = e.changedTouches[0];
            joyTouchId = touch.identifier;
            updateJoystick(touch);
        });

        window.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joyTouchId) {
                    updateJoystick(e.changedTouches[i]);
                }
            }
        });

        const stopJoystick = (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joyTouchId) {
                    joyTouchId = null;
                    joyVector = { x: 0, y: 0 };
                    joyStick.style.transform = `translate(-50%, -50%)`;
                }
            }
        };
        window.addEventListener('touchend', stopJoystick);
        window.addEventListener('touchcancel', stopJoystick);

        function updateJoystick(touch) {
            const rect = joyBase.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const dist = Math.min(Math.hypot(dx, dy), 50);
            const angle = Math.atan2(dy, dx);
            dx = Math.cos(angle) * dist;
            dy = Math.sin(angle) * dist;
            joyStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joyVector = { x: dx / 50, y: dy / 50 };
        }

        // Buton Dinleyicileri
        document.getElementById('btn-fire').addEventListener('touchstart', (e) => { e.preventDefault(); fireWeapon(); });
        document.getElementById('btn-reload').addEventListener('click', () => {
            if (mixers[currentWeaponIndex]) {
                const m = mixers[currentWeaponIndex];
                m.action.reset();
                m.action.paused = false;
                m.action.play();
            }
        });

        document.getElementById('btn-switch').addEventListener('click', () => {
            weapons[currentWeaponIndex].visible = false;
            currentWeaponIndex = (currentWeaponIndex + 1) % weapons.length;
            weapons[currentWeaponIndex].visible = true;
        });

        document.getElementById('btn-aim').addEventListener('touchstart', (e) => {
            e.preventDefault();
            player.isAiming = !player.isAiming;
        });

        document.getElementById('btn-sprint').addEventListener('touchstart', (e) => {
            e.preventDefault();
            player.isSprinting = !player.isSprinting;
        });

        document.getElementById('btn-crouch').addEventListener('touchstart', (e) => {
            e.preventDefault();
            player.isCrouching = !player.isCrouching;
        });

        // E Menüsü Butonları
        const settingsMenu = document.getElementById('settings-menu');
        document.getElementById('menu-btn').addEventListener('click', () => {
            settingsMenu.style.display = (settingsMenu.style.display === 'flex') ? 'none' : 'flex';
        });
        document.getElementById('close-menu').addEventListener('click', () => {
            settingsMenu.style.display = 'none';
        });

        document.getElementById('spawn-npc-btn').addEventListener('click', () => {
            spawnNPC((Math.random() - 0.5) * 15, camera.position.z - 8 - Math.random() * 5);
        });

        document.getElementById('clear-npcs-btn').addEventListener('click', () => {
            npcs.forEach(n => scene.remove(n.group));
            npcs.length = 0;
        });

        document.getElementById('blood-toggle').addEventListener('change', (e) => {
            allowBlood = e.target.checked;
        });

        document.getElementById('bodycam-fx-toggle').addEventListener('change', (e) => {
            document.getElementById('bodycam-overlay').style.display = e.target.checked ? 'block' : 'none';
        });

        document.getElementById('fov-slider').addEventListener('input', (e) => {
            camera.fov = parseFloat(e.target.value);
            camera.updateProjectionMatrix();
        });

        // --- Oyun Döngüsü ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Mixers (Animasyon) Güncelleme
            mixers.forEach(m => { if(m && m.mixer) m.mixer.update(delta); });

            // Kamera Yönü
            camera.rotation.x = player.pitch;
            camera.rotation.y = player.yaw;
            camera.rotation.z = 0; // Yan yatmayı engelle

            // Hareket Hesaplama
            const speed = player.isSprinting ? 0.12 : (player.isCrouching ? 0.04 : 0.07);
            const moveZ = joyVector.y * speed;
            const moveX = joyVector.x * speed;

            const sinY = Math.sin(player.yaw);
            const cosY = Math.cos(player.yaw);

            player.pos.x += moveX * cosY + moveZ * sinY;
            player.pos.z += -moveX * sinY + moveZ * cosY;

            // Eğilme Boyu
            const targetY = player.isCrouching ? 1.0 : 1.65;
            player.pos.y += (targetY - player.pos.y) * 0.1;

            // Nefes Alma / Bodycam Sallantısı
            const isMoving = Math.abs(joyVector.x) > 0.1 || Math.abs(joyVector.y) > 0.1;
            const bobSpeed = isMoving ? (player.isSprinting ? 12 : 8) : 2;
            const bobAmount = isMoving ? (player.isSprinting ? 0.04 : 0.02) : 0.005;

            camera.position.x = player.pos.x;
            camera.position.y = player.pos.y + Math.sin(time * bobSpeed) * bobAmount;
            camera.position.z = player.pos.z;

            // Silah Pozisyonu Yumuşatma (ADS & Recoil)
            const targetGunPos = player.isAiming ? new THREE.Vector3(0, -0.12, -0.25) : new THREE.Vector3(0.18, -0.22, -0.4);
            weaponGroup.position.lerp(targetGunPos, 0.15);
            weaponGroup.rotation.x *= 0.85;

            // NPC AI Yapay Zeka & Animasyonları
            npcs.forEach(npc => {
                if (npc.isDead) return;

                npc.animTime += delta * 6;

                if (npc.fleeing) {
                    npc.changeDirTimer -= delta;
                    if (npc.changeDirTimer <= 0) {
                        // Rastgele Yön Değiştir (Zigzag)
                        npc.targetAngle += (Math.random() - 0.5) * 1.5;
                        npc.changeDirTimer = 1.5 + Math.random() * 2;
                    }

                    // Kaçış Hareketi
                    npc.group.rotation.y = npc.targetAngle;
                    npc.group.translateZ(0.04);

                    // Koşma Bacak Animasyonu
                    npc.legL.rotation.x = Math.sin(npc.animTime) * 0.7;
                    npc.legR.rotation.x = -Math.sin(npc.animTime) * 0.7;
                    npc.armL.rotation.x = -Math.sin(npc.animTime) * 0.7;
                    npc.armR.rotation.x = Math.sin(npc.animTime) * 0.7;
                } else {
                    // Normal Bekleme Hafif Sallantı
                    npc.legL.rotation.x = 0; npc.legR.rotation.x = 0;
                    npc.armL.rotation.x = 0; npc.armR.rotation.x = 0;
                }
            });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
